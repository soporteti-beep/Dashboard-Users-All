<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - AYS CONSTRUSALCO</title>
    
    <!-- Chart.js y SheetJS (Para leer Excel .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            var(--primary): #1a73e8; var(--bg-color): #f5f6f8; var(--card-bg): #ffffff; var(--text-main): #1f1f1f; var(--border): #e2e2e2;
        }
        body { font-family: 'Google Sans', Arial, sans-serif; background-color: #f5f6f8; margin: 0; padding: 0; color: #1f1f1f; }
        .header { background: #fff; border-bottom: 1px solid #e2e2e2; padding: 20px 30px; margin-bottom: 28px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; color:#1a73e8;}
        .container { max-width: 1450px; margin: 0 auto; padding: 0 28px 50px 28px; }
        .error-msg { background: #fce8e6; color: #d93025; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; display: none; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .kpi-card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-left: 4px solid #1a73e8; }
        .kpi-header { color: #555; font-size: 14px; font-weight: 500; margin-bottom: 10px;}
        .kpi-value { font-size: 31px; font-weight: 600; color: #111; }
        
        .chart-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border: 1px solid #ddd; margin-bottom: 28px;}
        .chart-card h3 { margin: 0 0 15px 0; font-size: 18px; color: #171717; font-weight: 600; border-bottom: 1px solid #eee; padding-bottom:10px;}
        
        .table-container { overflow-y: auto; max-height: 500px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
        th { background-color: #f5f5f5; color: #444; padding: 12px; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f8fbff; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container" style="padding:0;">
            <h1><i class="fa-solid fa-boxes-stacked"></i> INVENTARIO - AYS CONSTRUSALCO</h1>
        </div>
    </div>

    <div class="container">
        <div id="errorMessage" class="error-msg">⚠️ No se encontró el archivo "GT-FO-01 INVENTARIO DE ACTIVOS FIJOS V2.xlsx". Suba el archivo a GitHub.</div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-header">Total Equipos</div>
                <div id="kpiTotal" class="kpi-value">...</div>
            </div>
            <div class="kpi-card" style="border-left-color: #f9ab00;">
                <div class="kpi-header">Portátiles</div>
                <div id="kpiPortatiles" class="kpi-value">...</div>
            </div>
            <div class="kpi-card" style="border-left-color: #1e8e3e;">
                <div class="kpi-header">Ubicación Principal</div>
                <div id="kpiUbicacion" class="kpi-value">...</div>
            </div>
        </div>

        <div class="chart-card">
            <h3>Listado de Equipos</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Responsable</th>
                            <th>Área</th>
                            <th>Cargo</th>
                            <th>Nombre Equipo</th>
                            <th>Serial / Tipo</th>
                            <th>Marca</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const EXCEL_FILE = "GT-FO-01 INVENTARIO DE ACTIVOS FIJOS V2.xlsx";
        const SHEET_NAME = "AYS CONTRUSALCO"; // Nombre exacto en tu Excel

        fetch(EXCEL_FILE)
            .then(res => {
                if(!res.ok) throw new Error("File not found");
                return res.arrayBuffer();
            })
            .then(data => {
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[SHEET_NAME];
                // El encabezado en esta hoja empieza en la fila 2 (índice 1 en SheetJS), saltamos 1 fila
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { range: 1 });
                
                let portatiles = 0;
                let ubicaciones = {};

                const tbody = document.getElementById('tableBody');
                
                jsonData.forEach(row => {
                    if(!row['NOMBRE EQUIPO']) return; // Ignorar filas vacías

                    if((row['TIPO'] || '').toUpperCase().includes('PORTATIL')) portatiles++;
                    
                    let ubi = row['UBICACIÓN'] || 'Sin Asignar';
                    ubicaciones[ubi] = (ubicaciones[ubi] || 0) + 1;

                    tbody.innerHTML += `<tr>
                        <td><strong>${row['RESPONSABLE'] || '--'}</strong></td>
                        <td>${row['AREA'] || '--'}</td>
                        <td>${row['CARGO'] || '--'}</td>
                        <td style="color:#1a73e8; font-weight:bold;">${row['NOMBRE EQUIPO']}</td>
                        <td>${row['SERIAL'] || '--'} <br><small style="color:#777;">${row['TIPO'] || ''}</small></td>
                        <td>${row['MARCA PORTATIL'] || '--'}</td>
                    </tr>`;
                });

                document.getElementById('kpiTotal').innerText = jsonData.filter(r => r['NOMBRE EQUIPO']).length;
                document.getElementById('kpiPortatiles').innerText = portatiles;
                
                // Encontrar la ubicación más común
                let mainUbi = Object.keys(ubicaciones).reduce((a, b) => ubicaciones[a] > ubicaciones[b] ? a : b, '--');
                document.getElementById('kpiUbicacion').innerText = mainUbi;
            })
            .catch(err => {
                document.getElementById('errorMessage').style.display = 'block';
                console.error(err);
            });
    </script>
</body>
</html>
