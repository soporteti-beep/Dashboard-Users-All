<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - ARKY</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        :root {
            --primary: #1a73e8; 
            --success: #1e8e3e;
            --danger: #d93025;
            --warning: #f9ab00;
            --bg-color: #f5f6f8;
            --card-bg: #ffffff;
            --text-main: #1f1f1f;
        }

        body { font-family: 'Google Sans', Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-main); }
        
        .header { background: #fff; border-bottom: 1px solid #e2e2e2; padding: 20px 30px; margin-bottom: 28px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; color: var(--primary);}
        
        .container { max-width: 1450px; margin: 0 auto; padding: 0 28px 50px 28px; }
        
        /* KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .kpi-card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-left: 4px solid var(--primary); position: relative;}
        .kpi-header { color: #555; font-size: 14px; font-weight: 500; margin-bottom: 10px; display: flex; justify-content: space-between;}
        .kpi-header i { font-size: 20px; opacity: 0.6; }
        .kpi-value { font-size: 31px; font-weight: 600; color: #111; }
        
        /* Grillas de Gráficas y Tablas */
        .charts-grid { display: grid; grid-template-columns: 1fr 3fr; gap: 20px; margin-bottom: 28px; }
        .chart-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border: 1px solid #ddd; }
        .chart-card h3 { margin: 0 0 15px 0; font-size: 18px; color: #171717; font-weight: 600; border-bottom: 1px solid #eee; padding-bottom:10px; display: flex; align-items: center; gap: 8px;}
        .chart-container { position: relative; height: 250px; width: 100%; }
        
        /* Estilos de Tablas */
        .table-container { overflow-y: auto; max-height: 400px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
        th { background-color: #f5f5f5; color: #444; padding: 12px; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 1; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f8fbff; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
        .badge-pc { background: #e3f2fd; color: #1a73e8; }
        .badge-propio { background: #e6f4ea; color: var(--success); }

        @media (max-width: 1100px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="container" style="padding:0;">
            <h1><i class="fa-solid fa-boxes-stacked"></i> INVENTARIO - ARKY</h1>
        </div>
    </div>

    <div class="container">
        <!-- KPIs SUPERIORES -->
        <div class="kpi-grid">
            <div class="kpi-card" style="border-left-color: var(--primary);">
                <div class="kpi-header"><span>Computadores Propios</span><i class="fa-solid fa-laptop"></i></div>
                <div id="kpiEquipos" class="kpi-value">8</div>
            </div>
            <div class="kpi-card" style="border-left-color: var(--success);">
                <div class="kpi-header"><span>Sedes Activas</span><i class="fa-solid fa-building"></i></div>
                <div id="kpiSedes" class="kpi-value">2</div>
            </div>
            <div class="kpi-card" style="border-left-color: var(--warning);">
                <div class="kpi-header"><span>Laptops Lenovo</span><i class="fa-solid fa-tag"></i></div>
                <div id="kpiLenovo" class="kpi-value">2</div>
            </div>
        </div>

        <div class="charts-grid">
            <!-- GRÁFICA DE DISTRIBUCIÓN -->
            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-pie"></i> Distribución de Marcas</h3>
                <div class="chart-container"><canvas id="assetChart"></canvas></div>
            </div>

            <!-- TABLA 1: COMPUTADORES -->
            <div class="chart-card">
                <h3><i class="fa-solid fa-laptop"></i> Inventario de Activos Tecnológicos</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Responsable</th>
                                <th>Área / Cargo</th>
                                <th>Ubicación / Sede</th>
                                <th>Equipo / Serial</th>
                                <th>Marca / Familia</th>
                                <th>Entrega</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DATA EMBEBIDA (Extraída de la matriz ARKY)
        const arkyData = [
          {"resp": "YURI TATIANA CUERVO", "area": "OPERACIONES", "cargo": "ANALISTA MESA DE SERVICIOS", "ubi": "BOGOTA", "sede": "CALLE 76", "equipo": "LISTAMESADESERVICIO", "serial": "5CD1218MSH", "tipo": "PROBOOK", "marca": "HP", "fecha": "21/07/2026"},
          {"resp": "KAREN FRESNEDA", "area": "360", "cargo": "COORDINADORA 360", "ubi": "BOGOTA", "sede": "CALLE 76", "equipo": "COORDINADORA360", "serial": "5CD1218NXB", "tipo": "PORTATIL", "marca": "DELL", "fecha": "05/08/2026"},
          {"resp": "FREDY GONZALES", "area": "OPERACIONES", "cargo": "ANALISTA MESA DE SERVICIOS", "ubi": "BOGOTA", "sede": "CALLE 76", "equipo": "MESADESERVICIO", "serial": "JC7DGY3", "tipo": "PORTATIL", "marca": "DELL", "fecha": "08/07/2026"},
          {"resp": "JULIAN ROBLES", "area": "DESARROLLO", "cargo": "LIDER INNOVACION", "ubi": "BOGOTA", "sede": "CALLE 76", "equipo": "LIDERINNOVACION", "serial": "PF3FSZ3G", "tipo": "THINKPAD", "marca": "LENOVO", "fecha": "12/06/2026"},
          {"resp": "RENE ALBERTO ROJAS CRUZ", "area": "COMERCIAL", "cargo": "DISENADOR Y COMMUNITY MANAGER", "ubi": "BOGOTA", "sede": "CALLE 99", "equipo": "GERENCIA06", "serial": "PF20APQD", "tipo": "THINKPAD", "marca": "LENOVO", "fecha": "24/06/2026"},
          {"resp": "WILMER FERNANDO BABATIVA MARTIN", "area": "CONTABILIDAD", "cargo": "COORDINADOR CONTABLE", "ubi": "BOGOTA", "sede": "CALLE 99", "equipo": "CONTABILIDADWILMER", "serial": "5CD119B7M1", "tipo": "PORTATIL", "marca": "HP", "fecha": "28/08/2026"},
          {"resp": "CRUZ MORERA DEISY VIVIANA", "area": "FINANCIERA", "cargo": "CONTROLLER", "ubi": "BOGOTA", "sede": "CALLE 99", "equipo": "CONTROLLERFINANCIERA", "serial": "5CD34334WD", "tipo": "PORTATIL", "marca": "HP", "fecha": "28/08/2026"},
          {"resp": "TERNERA FORERO DANILO ENRIQUE", "area": "GERENCIA", "cargo": "GERENTE JURIDICO", "ubi": "BOGOTA", "sede": "CALLE 99", "equipo": "GERENCIAJURIDICA", "serial": "5CG1404HTQ", "tipo": "PORTATIL", "marca": "HP", "fecha": "27/08/2026"}
        ];

        let countHP = 0;
        let countLenovo = 0;
        let countDell = 0;
        
        let sedesUnicas = new Set();

        const tbody = document.getElementById('tableBody');
        
        arkyData.forEach(eq => {
            sedesUnicas.add(eq.sede.toUpperCase());
            
            let marcaUpper = eq.marca.toUpperCase();
            if(marcaUpper.includes('HP')) countHP++;
            if(marcaUpper.includes('LENOVO')) countLenovo++;
            if(marcaUpper.includes('DELL')) countDell++;

            tbody.innerHTML += `<tr>
                <td><strong>${eq.resp}</strong><br><span class="badge badge-propio" style="margin-top:4px;"><i class="fa-solid fa-check"></i> Propio</span></td>
                <td>${eq.area}<br><small style="color:#777;">${eq.cargo}</small></td>
                <td><i class="fa-solid fa-location-dot" style="color:#777;"></i> ${eq.ubi}<br><small style="color:#1a73e8; font-weight:600;">Sede: ${eq.sede}</small></td>
                <td>
                    <strong style="color:var(--primary);">${eq.equipo}</strong><br>
                    <small style="color:#555;">SN: ${eq.serial}</small>
                </td>
                <td><span class="badge badge-pc">${eq.marca}</span><br><small style="color:#777;">${eq.tipo}</small></td>
                <td>${eq.fecha}</td>
            </tr>`;
        });

        // Actualizar KPIs Menores
        document.getElementById('kpiSedes').innerText = sedesUnicas.size;
        document.getElementById('kpiLenovo').innerText = countLenovo;

        // DIBUJAR GRÁFICA DE DONA (HP, Lenovo, Dell)
        new Chart(document.getElementById('assetChart'), {
            type: 'doughnut',
            data: {
                labels: ['Laptops HP', 'Laptops LENOVO', 'Laptops DELL'],
                datasets: [{
                    data: [countHP, countLenovo, countDell],
                    backgroundColor: ['#1a73e8', '#f9ab00', '#1e8e3e'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: { maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } }
        });
    </script>
</body>
</html>
