    <style>
        :root {
            --primary: #1a73e8; 
            --success: #1e8e3e;
            --danger: #d93025;
            --warning: #f9ab00;
            --bg-color: #f5f6f8;
            --card-bg: #ffffff;
            --text-main: #1f1f1f;
        }

        body { font-family: 'Google Sans', Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-main); }
        
        .header { background: #fff; border-bottom: 1px solid #e2e2e2; padding: 20px 30px; margin-bottom: 28px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; color: var(--primary);}
        
        .container { max-width: 1450px; margin: 0 auto; padding: 0 28px 50px 28px; }
        
        /* KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .kpi-card { background: #fff; border-radius: 8px; padding: 22px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-left: 4px solid var(--primary); }
        .kpi-header { color: #555; font-size: 14px; font-weight: 500; margin-bottom: 10px; display: flex; justify-content: space-between;}
        .kpi-header i { font-size: 20px; opacity: 0.6; }
        .kpi-value { font-size: 31px; font-weight: 600; color: #111; }
        
        /* Tabla */
        .chart-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border: 1px solid #ddd;}
        .chart-card h3 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom:10px; display: flex; align-items: center; gap: 8px;}
        
        .table-container { overflow-y: auto; max-height: 500px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background-color: #f5f5f5; color: #444; padding: 12px; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 1;}
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f8fbff; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
        .badge-propio { background: #e6f4ea; color: var(--success); }
        .badge-alquiler { background: #fce8e6; color: var(--danger); }
        .badge-monitor { background: #fef0d9; color: var(--warning); }
    </style>

        ];

        let propios = 0;
        let alquiler = 0;
        let totalEquipos = 0;
        let totalMonitores = 0;
        const tbody = document.getElementById('tableBody');

        jsonData.forEach(row => {
            if(!row.responsable && !row.equipo) return;

            let badgeModalidad = '';
            if (row.modalidad === 'Propio') {
                propios++;
                totalEquipos++;
                badgeModalidad = `<span class="badge badge-propio"><i class="fa-solid fa-check"></i> Propio</span>`;
            } else if (row.modalidad === 'Alquilado') {
                alquiler++;
                totalEquipos++;
                badgeModalidad = `<span class="badge badge-alquiler"><i class="fa-solid fa-file-contract"></i> Alquilado</span>`;
            } else if (row.equipo) {
                totalEquipos++;
                badgeModalidad = `<span style="color:#777; font-size:11px;">No especificado</span>`;
            }

            let monitorHtml = '--';
            if (row.monitor && row.monitor !== 'N/A') {
                totalMonitores++;
                let plaquetaMon = row.plaq_mon && row.plaq_mon !== 'N/A' && row.plaq_mon !== 'SI' ? `<br><small style="color:#777;">${row.plaq_mon}</small>` : '';
                monitorHtml = `<span class="badge badge-monitor"><i class="fa-solid fa-desktop"></i> ${row.monitor}</span>${plaquetaMon}`;
            }

            tbody.innerHTML += `<tr>
                <td><strong>${row.responsable || '--'}</strong><br><small style="color:#777;">${row.area || ''}</small></td>
                <td>${row.cargo || '--'}</td>
                <td>${row.ubicacion || '--'}</td>
                <td>
                    <strong style="color:var(--primary);">${row.equipo || '--'}</strong><br>
                    <small style="color:#555;">${row.marca || '--'} / SN: ${row.serial || '--'}</small>
                </td>
                <td>${monitorHtml}</td>
                <td>${badgeModalidad}</td>
            </tr>`;
        });

        // Actualizar KPIs
        document.getElementById('kpiTotal').innerText = totalEquipos;
        document.getElementById('kpiPropios').innerText = propios;
        document.getElementById('kpiAlquiler').innerText = alquiler;
        document.getElementById('kpiMonitores').innerText = totalMonitores;
    </script>
