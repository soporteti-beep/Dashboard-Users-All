<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Multi-Consolas</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Google Sans', sans-serif; background: #f8f9fa; overflow: hidden; }
        
        /* Estilos de las pestañas */
        .tabs-container { background: #ffffff; border-bottom: 1px solid #dadce0; display: flex; padding: 0 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .tab-btn { background: none; border: none; padding: 18px 24px; font-size: 15px; font-weight: 500; color: #5f6368; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab-btn:hover { background: #f1f3f4; color: #202124; }
        .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        
        /* Contenedor de las vistas */
        .iframe-container { width: 100%; height: calc(100vh - 57px); border: none; display: none; }
        .iframe-container.active { display: block; }
    </style>
</head>
<body>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="openTab(event, 'vista-servialco')">Google SERVIALCO</button>
        <button class="tab-btn" onclick="openTab(event, 'vista-construsalco')">Google CONSTRUSALCO</button>
        <button class="tab-btn" onclick="openTab(event, 'vista-microsoft')">Microsoft</button>
    </div>

    <!-- Aquí se cargan tus otros archivos HTML -->
    <iframe id="vista-servialco" class="iframe-container active" src="servialco.html"></iframe>
    <iframe id="vista-construsalco" class="iframe-container" src="construsalco.html"></iframe>
    <iframe id="vista-microsoft" class="iframe-container" src="microsoft.html"></iframe>

    <script>
        function openTab(evt, vistaId) {
            // Ocultar todos los iframes
            let iframes = document.getElementsByClassName("iframe-container");
            for (let i = 0; i < iframes.length; i++) {
                iframes[i].classList.remove("active");
            }
            // Quitar el color azul de todos los botones
            let botones = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < botones.length; i++) {
                botones[i].classList.remove("active");
            }
            // Mostrar el iframe seleccionado y pintar el botón
            document.getElementById(vistaId).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
